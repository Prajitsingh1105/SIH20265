services:
  postgres:
    image: postgres:16-alpine
    container_name: deposittrack-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: deposittrack
      POSTGRES_PASSWORD: deposittrackpass
      POSTGRES_DB: deposittrack_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U deposittrack -d deposittrack_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: deposittrack-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: quay.io/minio/minio:latest
    container_name: deposittrack-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: deposittrack-mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  ocr-service:
    build:
      context: ./ocr-service
      dockerfile: Dockerfile
    container_name: deposittrack-ocr
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: deposittrack-api
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DEMO_MODE=true
      - FRONTEND_URL=http://localhost:5173
      - DATABASE_URL=postgresql://deposittrack:deposittrackpass@postgres:5432/deposittrack_db?schema=public
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - MINIO_ENDPOINT=minio
      - MINIO_PORT=9000
      - MINIO_USE_SSL=false
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET_NAME=fdr-vault
      - SMTP_HOST=mailpit
      - SMTP_PORT=1025
      - SMTP_FROM="DEPOSIT-TRACK AICTE" <notifications@deposittrack.gov.in>
      - OCR_SERVICE_URL=http://ocr-service:8000
      - JWT_SECRET=sih2026_super_secure_jwt_secret_strataxx_ai_fdr_portal_987654321
      - JWT_REFRESH_SECRET=sih2026_super_secure_jwt_refresh_secret_strataxx_ai_fdr_portal_123456789
      - FILE_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started
      ocr-service:
        condition: service_started

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: deposittrack-web
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
